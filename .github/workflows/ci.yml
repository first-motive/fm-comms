name: ci

# PR + push validation. This repo is configuration and the scripts that place it,
# so CI shellchecks every script and proves both front doors survive the
# `curl | bash` path users are told to run.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      # Pin the version so CI matches local dev — the runner's bundled
      # shellcheck drifts and flags findings a newer release dropped.
      - name: Install shellcheck 0.11.0
        run: |
          set -euo pipefail
          # Verify before extracting: this binary is installed with sudo and then
          # run against the repo, so an unverified download would be arbitrary
          # elevated code on a runner that can read secrets.
          sum=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            -o shellcheck.tar.xz
          echo "$sum  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz
          sudo install shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version
      - name: Run shellcheck
        run: |
          set -euo pipefail
          # Fed by find, not a glob, so an empty scripts/ is not a bare literal.
          mapfile -t targets < <(find . -name '*.sh' -not -path './.git/*' | sort)
          printf '%s\n' "${targets[@]}"
          shellcheck "${targets[@]}"

  curl-smoke:
    name: curl|bash path
    # Piping a script into bash makes bash read it from stdin, which empties
    # BASH_SOURCE and breaks process substitution — the failure mode the eval
    # fetch in fm_load_lib exists to avoid. Pipe each front door in exactly as
    # the docs tell users to, and assert the lib loaded. FM_SELFTEST stops each
    # script after deps load and the OS resolves, before any real install.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: run.sh + install.sh load lib over piped curl
        run: |
          set -euo pipefail
          repo="$PWD"
          # Run from an empty dir so each script takes its network (curl) branch
          # — the piped path real users hit — instead of finding lib.sh beside a
          # clone. lib.sh is fetched at the pinned tag.
          cd "$(mktemp -d)"
          # Fetch lib.sh from the commit under test rather than the pinned
          # release tag, so CI proves this change's pipe path, not a published one.
          export FM_TAG="$GITHUB_SHA"
          for s in run.sh install.sh; do
            echo "== $s =="
            out="$(FM_SELFTEST=1 bash < "$repo/$s" 2>&1)" \
              || { echo "$out"; echo "FAIL: $s exited non-zero under curl|bash"; exit 1; }
            echo "$out"
            echo "$out" | grep -q "selftest ok" \
              || { echo "FAIL: $s did not load lib via piped curl"; exit 1; }
          done
          echo "curl|bash path OK"
