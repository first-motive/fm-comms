name: ci

# PR + push validation. This repo is configuration and the scripts that place it,
# so CI shellchecks every script and proves both front doors survive the
# `curl | bash` path users are told to run.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Rendered files (AGENTS.md, .fm/) come from the render plane and carry a hash of
  # their own body. This fails the PR when one was edited in place.
  drift:
    uses: first-motive/.github/.github/workflows/drift-check.yml@main

  # No server-side branch protection exists on this repo, so a push straight to
  # main is possible. The rendered pre-push hook refuses one locally; this
  # notices the ones it cannot refuse and opens an issue naming the commit.
  # The called job guards on push-to-default itself, so it skips on a PR.
  # Job-level permissions replace the workflow-level block for this job alone:
  # opening the issue needs issues:write, which the rest of CI must not have.
  tripwire:
    uses: first-motive/.github/.github/workflows/direct-push-tripwire.yml@main
    permissions:
      contents: read
      issues: write
      pull-requests: read

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      # Pin the version so CI matches local dev — the runner's bundled
      # shellcheck drifts and flags findings a newer release dropped.
      - name: Install shellcheck 0.11.0
        run: |
          set -euo pipefail
          # Verify before extracting: this binary is installed with sudo and then
          # run against the repo, so an unverified download would be arbitrary
          # elevated code on a runner that can read secrets.
          sum=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            -o shellcheck.tar.xz
          echo "$sum  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz
          sudo install shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version
      - name: Run shellcheck
        run: |
          set -euo pipefail
          # Fed by find, not a glob, so an empty scripts/ is not a bare literal.
          mapfile -t targets < <(find . -name '*.sh' -not -path './.git/*' | sort)
          printf '%s\n' "${targets[@]}"
          shellcheck "${targets[@]}"

  episodes:
    name: episodes tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      # --frozen so CI fails on a stale uv.lock rather than silently resolving
      # something the rigs will never install.
      - run: uv sync --frozen --project episodes
      - run: uv run --frozen --project episodes pytest -q
        working-directory: episodes

  # The configuration this repo exists to ship, graded three ways: no real
  # endpoint was committed, every template still renders, and the rendered result
  # holds the invariants the fleet depends on — one non-wildcard router bind, an
  # allowlist on every bridge, and no rule that admits a raw frame or an inbound
  # trajectory. Cheap, so it runs on every pull request.
  transport-configs:
    name: transport configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - run: uv run scripts/ci/check-transport.py

  # The other question rendering cannot answer: does a reinstall change what the
  # running service reads? `systemctl enable --now` is a no-op on a unit that is
  # already up, which left fm-ws-01 filtering with the profile it had before its
  # card changed (fm-comms#20). The installer is driven in dry-run mode with a
  # stubbed uname, so both service paths are graded on one runner.
  reinstall-restart:
    name: reinstall restarts the service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - run: ./scripts/ci/test-reinstall-restart.sh

  # The one question the check above cannot answer: do a router and a bridge at
  # the pinned version actually form a session? It asserts the router's own
  # session count through its admin space, so a bridge that starts and never
  # connects fails here rather than on a rig.
  transport-smoke:
    name: bridge to router smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - run: ./scripts/ci/smoke-transport.sh

  # Piping a script into bash makes bash read it from stdin, which empties
  # BASH_SOURCE and breaks process substitution — the failure mode the eval fetch
  # in fm_load_lib exists to avoid. The org workflow pipes each front door in
  # exactly as the docs tell users to. FM_TAG points at the commit under test, so
  # this proves this change's pipe path rather than a published one. Both host
  # families run it: macOS resolves a different branch than Linux.
  curl-smoke-linux:
    uses: first-motive/.github/.github/workflows/bootstrap-selftest.yml@main
    with:
      scripts: run.sh install.sh
      script-env: FM_TAG=${{ github.sha }}

  curl-smoke-macos:
    uses: first-motive/.github/.github/workflows/bootstrap-selftest.yml@main
    with:
      scripts: run.sh install.sh
      script-env: FM_TAG=${{ github.sha }}
      runs-on: '"macos-latest"'
