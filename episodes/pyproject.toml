# The episode queryable — the one piece of Python in fm-comms.
#
# Its own uv project rather than a workspace dependency: it runs on a processor rig
# beside the bags, not inside the ROS env, and rosdep/pixi have no zenoh package to
# give it. `uv sync` here, `uv run episodes` to serve.
#
# The zenoh wheel is pinned to the same 1.9.x line as zenoh/zenoh.version. A
# queryable that speaks a different protocol version than the router is exactly the
# split the single pin exists to prevent.

[project]
name = "fm-comms-episodes"
version = "0.1.0"
description = "Serve First Motive episode index and MCAP fetch over Zenoh"
requires-python = ">=3.10"
dependencies = [
    "eclipse-zenoh>=1.9.0,<1.10",
]

[project.scripts]
episodes = "episodes.service:main"
# The pull half, run on a processor: fetch what this host is missing from a
# recorder's queryable.
episodes-fetch = "episodes.fetch:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["episodes"]
